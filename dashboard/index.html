<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>高位回撤观测智能体</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#06130f;--panel:#0d2119;--line:#24503d;--text:#effff6;--muted:#9ab8aa;--red:#ff7180;--green:#4ee6a3;--amber:#f5c866;--cyan:#74e5bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 8%,#174e38 0,#0b291e 22%,transparent 45%),radial-gradient(ellipse at 88% 16%,#123d2c 0,#071b14 28%,transparent 55%),linear-gradient(145deg,#06130f,#0a2118 55%,#04100c);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;position:relative;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.7;background-image:radial-gradient(circle at 8% 18%,#d8fff0 0 1px,transparent 1.6px),radial-gradient(circle at 22% 70%,#a9f5d2 0 1px,transparent 1.8px),radial-gradient(circle at 46% 13%,#eafff5 0 1.2px,transparent 1.8px),radial-gradient(circle at 67% 32%,#c6ffe4 0 1px,transparent 1.5px),radial-gradient(circle at 91% 66%,#d8fff0 0 1.1px,transparent 1.7px),radial-gradient(circle at 77% 87%,#a9f5d2 0 1px,transparent 1.6px);background-size:260px 220px,340px 280px,410px 310px,290px 250px,370px 300px,320px 270px;filter:blur(.2px)}body:after{content:"";position:fixed;width:360px;height:360px;right:-120px;top:90px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 32% 28%,#91f7cd 0,#38ab7d 8%,#135b40 34%,#092719 68%,transparent 70%);box-shadow:-30px 20px 80px #38d99a2b;opacity:.42;filter:blur(1px)}.wrap{position:relative;z-index:1;max-width:1180px;margin:auto;padding:34px 22px 60px}.eyebrow{color:var(--cyan);letter-spacing:.16em;font-size:11px;text-transform:uppercase}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:8px 0 28px}.hero h1{font-size:clamp(30px,5vw,58px);line-height:1.05;margin:8px 0}.hero p{color:var(--muted);max-width:640px;margin:0}.stamp{border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--muted);min-width:150px;background:#0b2118cc;backdrop-filter:blur(12px)}.stamp strong{display:block;color:var(--text);font-size:22px}.card{background:rgba(10,30,22,.88);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 50px #0006;margin-top:16px;backdrop-filter:blur(12px)}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.section-head h2{font-size:18px;margin:0}.section-head span{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid var(--line);border-radius:14px;padding:15px;background:#0a1d15cc}.stat label{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:24px;margin-top:6px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:9px;border-bottom:1px solid var(--line)}.table td{padding:12px 9px;border-bottom:1px solid #1b3b2d}.table tbody tr{cursor:pointer;transition:background .2s,transform .2s}.table tbody tr:hover{background:#16432f88}.table tbody tr.selected{background:#1b5d4088;box-shadow:inset 3px 0 var(--cyan)}.coin{display:flex;align-items:center;gap:9px;font-weight:650}.negative{color:var(--red)}.positive{color:var(--green)}.signal{color:var(--amber);font-size:12px}.selectbar{display:flex;gap:10px;flex-wrap:wrap}.selectbar select,.selectbar button{background:#081a13;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 13px}.selectbar button{cursor:pointer;background:#126044;border-color:#29966e}.charts{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.chartbox{height:310px}.note{color:var(--muted);font-size:12px;margin-top:12px}.footer{color:#719387;font-size:12px;margin-top:20px}@media(max-width:760px){.hero{display:block}.stamp{margin-top:18px}.stats{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap">
<div class="eyebrow">MARKET INTELLIGENCE / PUBLIC DATA</div><div class="hero"><div><h1>高位回撤<br>观测智能体</h1><p>参赛作品 · 用真实公开行情，先找出远离历史高点的资产，再把价格与成交量叠加成可解释的支撑压力地图。</p></div><div class="stamp"><strong id="assetCount">--</strong>主流资产观测<br><span id="updated">正在同步</span></div></div>
<section class="card"><div class="section-head"><h2>01 / 历史高点回撤雷达</h2><span>按距 ATH 的回撤幅度排序</span></div><div class="stats"><div class="stat"><label>最大回撤</label><b id="maxDD" class="negative">--</b></div><div class="stat"><label>深度回撤资产</label><b id="deepCount">--</b></div><div class="stat"><label>平均回撤</label><b id="avgDD">--</b></div><div class="stat"><label>数据状态</label><b class="positive">LIVE</b></div></div><div class="table-wrap"><table class="table"><thead><tr><th>资产</th><th>现价</th><th>历史最高价</th><th>距 ATH</th><th>24h</th><th>观察信号</th></tr></thead><tbody id="rows"><tr><td colspan="6">正在获取公开市场数据…</td></tr></tbody></table></div></section>
<section class="card"><div class="section-head"><h2>02 / 成交量分布 · 支撑压力</h2><span>近一年日线数据</span></div><div class="selectbar"><select id="coinSelect"></select><button id="refresh">重新分析</button></div><div class="charts"><div class="chartbox"><canvas id="priceChart"></canvas></div><div class="chartbox"><canvas id="profileChart"></canvas></div></div><div id="zoneText" class="note">选择资产后，系统将依据成交量密集区给出下方支撑与上方压力。</div></section>
<div class="footer">数据来源：CoinGecko 公共接口 · 分析结果仅用于研究，不构成投资建议</div></main>
<script>
let rows=[],priceChart,profileChart;const $=id=>document.getElementById(id);function usd(v){return v>=1000?'$'+v.toLocaleString(undefined,{maximumFractionDigits:0}):'$'+v.toLocaleString(undefined,{maximumFractionDigits:4})}function pct(v){return (v>0?'+':'')+Number(v||0).toFixed(2)+'%'}
async function loadOverview(){const res=await fetch('/api/overview');rows=await res.json();if(!Array.isArray(rows))throw Error(rows.error);$('assetCount').textContent=rows.length;$('updated').textContent='刚刚更新 · CoinGecko';$('maxDD').textContent=pct(rows[0].drawdown);$('deepCount').textContent=rows.filter(x=>x.drawdown<=-70).length;$('avgDD').textContent=pct(rows.reduce((a,x)=>a+x.drawdown,0)/rows.length);$('rows').innerHTML=rows.map(x=>`<tr data-coin="${x.id}" title="点击查看 ${x.name} 的成交量分布与支撑压力"><td><div class="coin"><span>${x.name}<small> ${x.symbol}</small></span></div></td><td>${usd(x.price)}</td><td>${usd(x.ath)}</td><td class="negative">${pct(x.drawdown)}</td><td class="${x.change_24h>=0?'positive':'negative'}">${pct(x.change_24h)}</td><td class="signal">${x.drawdown<=-70?'深度回撤，关注支撑':'持续远离 ATH'} · 点击分析</td></tr>`).join('');$('coinSelect').innerHTML=rows.map(x=>`<option value="${x.id}">${x.name} (${x.symbol})</option>`).join('');document.querySelectorAll('#rows tr[data-coin]').forEach(row=>row.onclick=()=>selectCoin(row.dataset.coin));selectCoin(rows[0].id)}
function selectCoin(id){$('coinSelect').value=id;document.querySelectorAll('#rows tr[data-coin]').forEach(row=>row.classList.toggle('selected',row.dataset.coin===id));loadAnalysis();document.querySelector('.charts').scrollIntoView({behavior:'smooth',block:'center'})}
async function loadAnalysis(){const id=$('coinSelect').value||'bitcoin';const data=await (await fetch('/api/analysis?coin='+id)).json();const labels=data.prices.map((_,i)=>i%30===0?'D'+i:'');if(priceChart)priceChart.destroy();priceChart=new Chart($('priceChart'),{type:'line',data:{labels,datasets:[{label:'价格 USD',data:data.prices,borderColor:'#62d7e8',backgroundColor:'#62d7e822',fill:true,pointRadius:0,tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8ea2ad'}}},scales:{x:{ticks:{color:'#60727c'},grid:{color:'#17232b'}},y:{ticks:{color:'#8ea2ad'},grid:{color:'#263440'}}}}});if(profileChart)profileChart.destroy();profileChart=new Chart($('profileChart'),{type:'bar',data:{labels:data.profile.map(x=>usd(x.price)),datasets:[{label:'成交量密度',data:data.profile.map(x=>x.volume),backgroundColor:data.profile.map(x=>x.price<=data.current?'#36d39999':'#ff5c6799'),borderWidth:0}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8ea2ad'}}},scales:{x:{ticks:{display:false},grid:{color:'#17232b'}},y:{ticks:{color:'#8ea2ad',maxTicksLimit:8},grid:{display:false}}}}});$('zoneText').innerHTML=`当前价 <b>${usd(data.current)}</b> · 下方支撑：<b class="positive">${data.support.slice(0,2).map(usd).join(' / ')||'暂无'}</b> · 上方压力：<b class="negative">${data.resistance.slice(0,2).map(usd).join(' / ')||'暂无'}</b>。密集成交峰值约 ${usd(data.peak_zone||0)}。`}
$('refresh').onclick=loadAnalysis;$('coinSelect').onchange=()=>selectCoin($('coinSelect').value);loadOverview().catch(e=>{ $('rows').innerHTML='<tr><td colspan="6">数据源暂时限流，请稍后点击重新分析。'+e.message+'</td></tr>'});
</script></body></html>
